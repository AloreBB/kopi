name: Android

on:
  push:
    paths:
      - "apps/android/**"
      - "protocol/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "protocol/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored; point Gradle at the runner's preinstalled SDK.
      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties

      - name: Check fixtures, test and build
        run: make fixtures-check android-test android
