name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test and build
        run: make fixtures-check mac-test mac

      - name: Zip app
        run: ditto -c -k --keepParent apps/macos/build/Kopi.app Kopi-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kopi-macos
          path: Kopi-macOS.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties

      # Debug build, signed with the debug key Gradle generates on the CI runner.
      - name: Test and build
        run: make fixtures-check android-test android

      - name: Rename APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk Kopi-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kopi-android
          path: Kopi-android.apk
          if-no-files-found: error

  publish:
    needs: [macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Kopi-macOS.zip dist/Kopi-android.apk \
            --title "Kopi $GITHUB_REF_NAME" \
            --generate-notes
